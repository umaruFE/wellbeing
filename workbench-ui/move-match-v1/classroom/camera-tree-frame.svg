  <path d="M19 198H281V218H19Z" fill="url(#camera-window-sill)" stroke="#B89548" stroke-width="1.4"/>
  <path d="M25 200H275" stroke="#FFF7D0" stroke-width="1.8" stroke-linecap="round"/>
