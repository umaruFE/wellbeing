<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3 视频生成</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172524;background:#f3f6f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:48px auto;padding:0 24px}header{margin-bottom:30px}h1{font-size:32px;letter-spacing:-1px;margin:0 0 10px}p{color:#6b7771;line-height:1.6;margin:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;border:1px solid #dde6df;border-radius:20px;padding:28px;box-shadow:0 8px 32px #263d2d05}.tabs{display:flex;gap:6px;background:#f1f5f2;padding:5px;border-radius:12px;margin-bottom:24px}.tabs button{flex:1;background:none;color:#65746a}.tabs button.active{background:white;color:#236548;box-shadow:0 2px 6px #0000000d}button{border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer}label{display:block;font-weight:600;font-size:14px;margin:20px 0 8px}textarea,select{width:100%;border:1px solid #d6e0d9;border-radius:10px;padding:12px;font:inherit;background:#fff;color:inherit}textarea{resize:vertical;min-height:148px;line-height:1.6}textarea:focus,select:focus{outline:2px solid #b3d5c2;outline-offset:1px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.upload{border:1px dashed #acc3b4;border-radius:12px;padding:22px;text-align:center;background:#f8fbf9}.upload input{max-width:100%;font:inherit;font-size:13px}.upload img{max-width:100%;max-height:180px;display:block;margin:14px auto 0;border-radius:8px}.submit{background:#236548;color:white;width:100%;margin-top:24px;font-weight:600}.submit:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;margin-top:10px}.status{background:#f2f6f3;padding:14px;border-radius:10px;line-height:1.6;font-size:14px;margin:18px 0;overflow-wrap:anywhere}.status.error{background:#fff1ee;color:#a23c2a}.preview{aspect-ratio:16/10;background:#f3f6f4;border-radius:12px;display:grid;place-items:center;overflow:hidden;color:#8a978e;text-align:center}.preview video{width:100%;max-height:420px;background:#111}.preview .empty{padding:24px;font-size:14px}.download{display:inline-block;color:#236548;margin-top:16px;font-weight:600}.badge{display:inline-block;font-size:11px;background:#e7f1ea;color:#366548;padding:5px 9px;border-radius:20px;margin-bottom:16px}h2{font-size:18px;margin:0} [hidden]{display:none!important}@media(max-width:760px){main{margin:28px auto;padding:0 16px}.layout{grid-template-columns:1fr}.card{padding:22px}h1{font-size:27px}}
</style></head><body><main><header><span class="badge">MINIMAX H3</span><h1>让画面动起来</h1><p>上传一张图片，或描述一个场景，直接生成一段视频。</p></header><div class="layout"><section class="card"><div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true" class="active" data-mode="t2v">文生视频</button><button type="button" role="tab" aria-selected="false" data-mode="i2v">图生视频</button></div><form id="form"><div id="imageSection" hidden><label for="image">起始图片</label><div class="upload"><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><img id="imagePreview" alt="起始图片预览" hidden></div><p class="hint">支持 PNG、JPEG、WebP，最大 20 MB。</p></div><label for="prompt">提示词</label><textarea id="prompt" maxlength="6000" required placeholder="例如：清晨的草地上，一只白色小羊轻轻跃起再稳稳落地。温暖柔和的阳光，清新卡通画风，固定镜头。"></textarea><div class="row"><div><label for="duration">视频时长</label><select id="duration"><option value="5">5 秒</option><option value="8">8 秒</option><option value="10">10 秒</option><option value="15">15 秒</option></select></div><div><label for="ratio">画幅</label><select id="ratio"><option value="16:9">横屏 · 864 × 480</option><option value="9:16">竖屏 · 480 × 864</option><option value="1:1">方形 · 480 × 480</option></select></div></div><button class="submit" id="submit">生成视频</button><p class="hint">一次生成一段视频，不生成分镜或独立音轨。关闭页面后任务会继续。</p></form></section><section class="card"><h2>生成结果</h2><div id="status" class="status" role="status" aria-live="polite">准备就绪，填写提示词后开始生成。</div><div class="preview"><div class="empty" id="empty">视频完成后会显示在这里<br>生成中会显示等待时间</div><video id="video" controls playsinline hidden></video></div><a id="download" class="download" hidden target="_blank" rel="noopener">打开 / 保存视频</a><p class="hint" id="task"></p></section></div></main><script>
const $=id=>document.getElementById(id);let mode='t2v',image='',previewUrl='',busy=false;
const storageKey='h3-video-task';
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function setBusy(value){busy=value;$('submit').disabled=value;$('submit').textContent=value?'正在生成…':'生成视频';}
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-selected',String(b===button));});$('imageSection').hidden=mode==='t2v';$('prompt').placeholder=mode==='i2v'?'描述图片中的主体如何运动、镜头如何变化。':'例如：清晨的草地上，一只白色小羊轻轻跃起再稳稳落地。温暖柔和的阳光，清新卡通画风，固定镜头。';});
$('image').onchange=async()=>{image='';const file=$('image').files[0];$('imagePreview').hidden=true;if(!file)return;if(file.size>20*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){status('请选择20MB以内的PNG、JPEG或WebP图片。',true);$('image').value='';return;}if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);$('imagePreview').src=previewUrl;$('imagePreview').hidden=false;try{image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}catch{status('图片读取失败，请重新选择。',true);}};
async function api(path,options){const r=await fetch(path,options);let data;try{data=await r.json();}catch{throw Error('服务暂时不可用，请稍后重试');}if(!r.ok||data.error)throw Error(data.error||'请求失败');return data;}
function saveTask(task){try{localStorage.setItem(storageKey,JSON.stringify(task));}catch{}}
async function poll(task){setBusy(true);$('task').textContent='任务编号：'+task.id;let errors=0;for(;;){try{const data=await api('api/tasks/'+encodeURIComponent(task.id));errors=0;if(data.status==='completed'){$('video').src=data.url;$('video').hidden=false;$('empty').hidden=true;$('download').href=data.url;$('download').hidden=false;status('生成完成 · 本次等待 '+data.elapsed+' 秒');saveTask({...task,completed:true});setBusy(false);return;}if(data.status==='failed')throw Error(data.error||'生成失败');status('视频生成中 · 已等待 '+data.elapsed+' 秒。任务可能正在排队，请耐心等待。');}catch(e){errors++;status(e.message+'。'+(errors<6?'正在重试…':''),true);if(errors>=6){setBusy(false);return;}}await new Promise(r=>setTimeout(r,5000));}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(mode==='i2v'&&!image){status('请先选择起始图片，等图片读取完成。',true);return;}setBusy(true);$('video').hidden=true;$('empty').hidden=false;$('download').hidden=true;status('正在上传并提交任务…');try{const data=await api('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,prompt:$('prompt').value.trim(),duration:Number($('duration').value),ratio:$('ratio').value,image:mode==='i2v'?image:undefined})});const task={id:data.id};saveTask(task);await poll(task);}catch(e){status(e.message,true);setBusy(false);}};
try{const task=JSON.parse(localStorage.getItem(storageKey)||'null');if(task?.id)poll(task);}catch{}
</script></body></html>
