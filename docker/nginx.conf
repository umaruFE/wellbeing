# ============================================================
# Nginx 配置 — 前端静态托管 + API 反向代理
# 复现 vite.config.js 中的 proxy 规则
# ============================================================

# gzip 压缩
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积限制（PPT 导出、图片上传）
    client_max_body_size 50m;

    # ---- API 反向代理 → 后端 Next.js ----
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # AI 生成耗时较长，超时放宽到 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 本地上传文件代理 → 后端 ----
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    # ---- PPT 静态资源代理 → 后端 ----
    location /ppt/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    # ---- ComfyUI 图片服务代理（可选，按需启用）----
    # 将 /ai/ 路径代理到 ComfyUI 图片实例
    # location /ai/ {
    #     rewrite ^/ai/(.*)$ /$1 break;
    #     proxy_pass https://your-comfyui-image-host:8188;
    #     proxy_set_header Host your-comfyui-image-host:8188;
    #     proxy_ssl_server_name on;
    # }

    # ---- ComfyUI 视频服务代理（可选，按需启用）----
    # location /ai-video/ {
    #     rewrite ^/ai-video/(.*)$ /$1 break;
    #     proxy_pass https://your-comfyui-video-host:8188;
    #     proxy_set_header Host your-comfyui-video-host:8188;
    #     proxy_ssl_server_name on;
    # }

    # ---- 静态资源缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
